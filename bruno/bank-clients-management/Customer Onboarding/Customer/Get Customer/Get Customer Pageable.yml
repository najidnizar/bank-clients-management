info:
  name: Get Customer Pageable
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/customers?page=0&size=10"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function () {
            expect(res.status).to.equal(200);
        });

        test("Content exists", function () {
            expect(res.body.content).to.exist;
        });

        test("Total elements exists", function () {
            expect(res.body.totalElements).to.exist;
        });

        test("Page number exists", function () {
            expect(res.body.number).to.exist;
        });

        test("Page size exists", function () {
            expect(res.body.size).to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
