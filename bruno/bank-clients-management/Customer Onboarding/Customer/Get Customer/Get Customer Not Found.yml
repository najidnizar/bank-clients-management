info:
  name: Get Customer Not Found
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/customers/c87cced3-a5e9-4778-a3ee-bbf9dc66ee67"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 404", function () {
            expect(res.status).to.equal(404);
        });

        test("Error is Not Found", function () {
            expect(res.body.error).to.equal("Not Found");
        });

        test("Status code is 404", function () {
            expect(res.body.status).to.equal(404);
        });

        test("Message exists", function () {
            expect(res.body.message).to.exist;
        });

        test("Path exists", function () {
            expect(res.body.path).to.exist;
        });

        test("Timestamp exists", function () {
            expect(res.body.timestamp).to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
