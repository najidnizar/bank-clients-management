info:
  name: Get Customer By Customer Number
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/customers/customer-number/C000000001"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => {
            expect(res.status).to.equal(200);
        });

        test("Id exists", () => {
            expect(res.body.id).to.exist;
        });

        test("Customer number exists", () => {
            expect(res.body.customerNumber).to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
