info:
  name: Customer Onboarding
  type: folder
  seq: 1

request:
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        const timestamp = Date.now();

        bru.setVar("firstName", "Nizar");
        bru.setVar("lastName", "Najid");
        bru.setVar("randomEmail", `nizar-${timestamp}@test.com`);
        bru.setVar("randomPhoneNumber", `+352${timestamp.toString().slice(-8)}`);
