info:
  name: Ping
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/customers/ping"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: Customer Onboarding Service Running

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
