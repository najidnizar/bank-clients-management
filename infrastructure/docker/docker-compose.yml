services:
  customer-onboarding-db:
    image: postgres:17
    container_name: customer-onboarding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_onboarding_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: