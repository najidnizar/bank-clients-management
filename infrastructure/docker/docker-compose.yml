services:
  customer-onboarding-db:
    image: postgres:17
    container_name: customer-onboarding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_onboarding_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  customer-kyc-db:
    image: postgres:17
    container_name: customer-kyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_kyc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - customer_kyc_postgres_data:/var/lib/postgresql/data
  customer-document-db:
    image: postgres:17
    container_name: customer-document-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_document_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - customer_document_postgres_data:/var/lib/postgresql/data
  customer-account-db:
    image: postgres:17
    container_name: customer-account-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_account_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - customer_account_postgres_data:/var/lib/postgresql/data
  customer-document-storage:
    image: minio/minio
    container_name: customer-document-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - customer_document_minio_data:/data
    command: server /data --console-address ":9001"
  kafka:
    image: apache/kafka:4.0.0
    container_name: bank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  postgres_data:
  customer_kyc_postgres_data:
  customer_document_postgres_data:
  customer_account_postgres_data:
  customer_document_minio_data: