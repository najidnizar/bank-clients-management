# Demo credentials only. Kubernetes Secrets are Base64-encoded, NOT encrypted: real credentials must never be
# committed to Git (use Sealed Secrets, External Secrets or a vault instead).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: bank
type: Opaque
stringData:
  username: postgres
  password: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: bank
type: Opaque
stringData:
  access-key: minio
  secret-key: minio123
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: bank
type: Opaque
stringData:
  username: admin
  password: admin
