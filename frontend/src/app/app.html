<mat-toolbar class="toolbar">
  <a routerLink="/" class="brand">
    <mat-icon>account_balance</mat-icon>
    <span>{{ 'app.name' | translate }}</span>
  </a>

  <nav>
    <a mat-button routerLink="/customers" routerLinkActive="active">
      {{ 'nav.customers' | translate }}
    </a>
  </nav>

  <span class="spacer"></span>

  <mat-chip-set [attr.aria-label]="'shell.roles' | translate">
    @for (role of auth.roles(); track role) {
      <mat-chip>{{ 'roles.' + role | translate }}</mat-chip>
    }
  </mat-chip-set>

  <span class="username">
    <mat-icon>person</mat-icon>
    {{ auth.username() }}
  </span>

  <button
    mat-button
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-label]="'shell.language' | translate"
    data-testid="language-menu"
  >
    <mat-icon>translate</mat-icon>
    {{ language.current() | uppercase }}
  </button>
  <mat-menu #languageMenu="matMenu">
    @for (lang of languages; track lang) {
      <button
        mat-menu-item
        [attr.lang]="lang"
        [attr.aria-current]="lang === language.current()"
        (click)="language.switchTo(lang)"
      >
        {{ 'languages.' + lang | translate }}
      </button>
    }
  </mat-menu>

  <button mat-button (click)="auth.logout()" data-testid="logout">
    <mat-icon>logout</mat-icon>
    {{ 'shell.logout' | translate }}
  </button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
