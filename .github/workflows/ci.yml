name: CI

on:
  push:
    branches: [ main, "feature/**", "bugfix/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-discovery
          - customer-api-gateway
          - customer-onboarding-service
          - customer-kyc-service
          - customer-document-service
          - customer-account-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # Integration tests use Testcontainers; Docker is available on ubuntu-latest runners
      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  docker-build:
    name: Docker image (${{ matrix.service }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-discovery
          - customer-api-gateway
          - customer-onboarding-service
          - customer-kyc-service
          - customer-document-service
          - customer-account-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Validates that every Dockerfile builds; images are not pushed yet
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: bank-clients-management/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
