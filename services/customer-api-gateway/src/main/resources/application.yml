spring:
  application:
    name: customer-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: lb://customer-onboarding-service
              predicates:
                - Path=/api/v1/customers/**

            - id: kyc-service
              uri: lb://customer-kyc-service
              predicates:
                - Path=/api/v1/kyc-cases/**

            - id: document-service
              uri: lb://customer-document-service
              predicates:
                - Path=/api/v1/documents/**

            - id: account-service
              uri: lb://customer-account-service
              predicates:
                - Path=/api/v1/accounts/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
          audiences: bank-api

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Health endpoints used by the Kubernetes probes: /actuator/health/liveness and /actuator/health/readiness
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
