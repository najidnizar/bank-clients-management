spring:
  application:
    name: customer-account-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
          audiences: bank-api

server:
  port: 8083

resilience4j:
  circuitbreaker:
    instances:
      customer-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        # Client errors are answers from the onboarding service, not failures: they must not open the circuit
        ignore-exceptions:
          - io.github.najidnizar.bankclientsmanagement.customer_account_service.exception.CustomerNotFoundException
          - org.springframework.security.access.AccessDeniedException
          - feign.FeignException$FeignClientException

springdoc:
  default-produces-media-type: application/json
