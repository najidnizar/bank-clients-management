spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/customer_account_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service
      auto-offset-reset: latest

  flyway:
    enabled: true
    locations: classpath:db/migration

customer-service:
  url: http://localhost:8080