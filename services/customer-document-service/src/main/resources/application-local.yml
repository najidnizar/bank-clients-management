spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/customer_document_db
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: document-service
      auto-offset-reset: latest

minio:
  url: http://localhost:9000
  access-key: minio
  secret-key: minio123