spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_onboarding_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092

  flyway:
    enabled: true
    locations: classpath:db/migration